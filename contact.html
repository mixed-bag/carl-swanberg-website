<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carl Swanberg — Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.08);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ─── Navigation ─── */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 10, 0.8);
            border-bottom: 1px solid var(--border);
        }

        .nav-name {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            text-decoration: none;
            transition: color var(--transition);
        }

        .nav-links a:hover {
            color: var(--text);
        }

        /* ─── Contact Content ─── */
        .contact-section {
            max-width: 700px;
            margin: 0 auto;
            padding: 8rem 2rem 6rem;
        }

        .back-link {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: #888;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 3rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #ccc;
        }

        .agency-logo {
            margin-bottom: 4rem;
            text-align: center;
        }

        .agency-logo img {
            height: 40px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .rep-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3rem;
        }

        .rep-category {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .rep-name {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .rep-email {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            text-decoration: none;
            display: block;
            margin-bottom: 0.25rem;
            transition: color 0.3s ease;
        }

        .rep-email:hover {
            color: var(--text);
        }

        .rep-phone {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            text-decoration: none;
            display: block;
            transition: color 0.3s ease;
        }

        .rep-phone:hover {
            color: var(--text);
        }

        /* ─── Footer ─── */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid var(--border);
        }

        footer p {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .footer-links a {
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--text);
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .nav-title {
                display: none;
            }

            .rep-grid {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }

            .contact-section {
                padding: 7rem 1.5rem 4rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <a href="index.html" class="nav-name">Carl Swanberg</a>
        <div class="nav-right">
            <a href="index.html" class="nav-title" style="text-decoration: none; color: inherit;">Production Designer</a>
            <div class="nav-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Contact -->
    <section class="contact-section">
        <a href="index.html" class="back-link">&larr; Back</a>

        <div class="agency-logo">

        </div>

        <div class="rep-grid">
            <div class="rep">
                <p class="rep-category">Commercials</p>
                <p class="rep-name">Steve Jacob</p>
                <a href="mailto:sjacob@wp-a.com" class="rep-email">sjacob@wp-a.com</a>
                <a href="tel:3238643614" class="rep-phone">323.864.3614</a>
            </div>
            <div class="rep">
                <p class="rep-category">Narrative</p>
                <p class="rep-name">Miranda Roseman</p>
                <a href="mailto:miranda@wp-a.com" class="rep-email">miranda@wp-a.com</a>
                <a href="tel:3143307482" class="rep-phone">(314) 330-7482</a>
            </div>
            <div class="rep">
                <p class="rep-category">Television</p>
                <p class="rep-name">Brian Goldberg</p>
                <a href="mailto:brian@wp-a.com" class="rep-email">brian@wp-a.com</a>
                <a href="tel:9089309474" class="rep-phone">908.930.9474</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Carl Swanberg. All rights reserved.</p>

            <a href="https://instagram.com/carl_swanberg" target="_blank" rel="noopener" aria-label="Instagram"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
            <a href="https://www.linkedin.com/in/carl-swanberg-6a377b3b8" target="_blank" rel="noopener" aria-label="LinkedIn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg></a>
        </div>
    </footer>

</body>
</html>
